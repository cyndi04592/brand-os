  // 注入一次 CSS
  var css = `
  .bsSpaceLoader{position:relative;width:100%;min-height:200px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
  .bsSL-floatA{animation:bsOrbit 9s ease-in-out infinite}
  .bsSL-floatB{animation:bsBreathe 4.3s ease-in-out infinite;
    filter:drop-shadow(0 0 8px rgba(124,108,255,.4)) drop-shadow(0 0 14px rgba(255,122,195,.16))}
  .bsSL-astro{width:140px;height:auto;display:block}
  @keyframes bsOrbit{0%{transform:translate(0,0)}25%{transform:translate(9px,-11px)}
    50%{transform:translate(0,-17px)}75%{transform:translate(-9px,-11px)}100%{transform:translate(0,0)}}
  @keyframes bsBreathe{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.035) rotate(3deg)}}
  .bsSL-tw{position:absolute;pointer-events:none}
  .bsSL-tw.t1{top:22px;left:24%;animation:bsTw 2.4s ease-in-out infinite}
  .bsSL-tw.t2{top:48px;right:20%;animation:bsTw 3.1s ease-in-out infinite .6s}
  .bsSL-tw.t3{bottom:54px;left:18%;animation:bsTw 2.8s ease-in-out infinite 1.1s}
  .bsSL-tw.t4{top:40%;right:26%;animation:bsTw 3.5s ease-in-out infinite .3s}
  .bsSL-tw.t5{bottom:70px;right:30%;animation:bsTw 2.6s ease-in-out infinite 1.5s}
  @keyframes bsTw{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
  .bsSL-txt{font-size:13px;color:rgba(255,255,255,.8);font-weight:700;letter-spacing:2px;z-index:3;
    display:flex;align-items:center;gap:8px;text-align:center}
  .bsSL-dots{display:inline-flex;gap:4px}
  .bsSL-dots i{width:5px;height:5px;border-radius:50%;
    background:linear-gradient(135deg,#7c6cff,#ff7ac3);animation:bsBlink 1.2s ease-in-out infinite}
  .bsSL-dots i:nth-child(2){animation-delay:.18s}.bsSL-dots i:nth-child(3){animation-delay:.36s}
  @keyframes bsBlink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  `;
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  function star(cls,size,fill){
    return '<div class="bsSL-tw '+cls+'"><svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24">'
      +'<path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="'+fill+'"/></svg></div>';
  }

  // 主函式
  window.showSpaceLoader = function(target, text){
    var el = (typeof target === 'string') ? document.getElementById(target) : target;
    if (!el) return;
    text = text || '載入中';
    el.innerHTML =
      '<div class="bsSpaceLoader">'
      + star('t1',14,'#a78bff') + star('t2',10,'#ff7ac3') + star('t3',12,'#ffffff')
      + star('t4',9,'#7c6cff') + star('t5',11,'#ffd9f4')
      + '<div class="bsSL-floatA"><div class="bsSL-floatB">'
      + '<img class="bsSL-astro" src="'+ASTRO+'" alt="loading"></div></div>'
      + '<div class="bsSL-txt">'+text+' <span class="bsSL-dots"><i></i><i></i><i></i></span></div>'
      + '</div>';
  };
  window.hideSpaceLoader = function(target){
    var el = (typeof target === 'string') ? document.getElementById(target) : target;
    if (el) el.innerHTML = '';
  };
})();

    showSpaceLoader('demo1','正在準備你的補給包');
    showSpaceLoader('demo2','載入訂閱方案');
