<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<script src="/i18n/i18n-loader.js?v=1.5"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand OS · 廣告監控</title>
<link rel="stylesheet" href="style.css">
<script src="loader.js"></script><!-- 系統共用太空人 Loading(showSpaceLoader) -->
<!--
  Brand OS · monitor.html · v2.3(2026-11-11)讀取時顯示系統太空人;v2.2加 CPA 診斷區;v2.1整頁重做;v2.1 自動更新改走暫存、Meta 限流時顯示提示
  這支只是「殼」:頂部列 + 品牌切換 + 日期 + 三個區塊的掛載點。
  ┌ monitor-data.js      資料管家(唯一跟 ads-monitor Worker 講話的檔)
  ├ monitor-overview.js  總覽 + 直客內部指標 + 漏斗 + 28 天走勢
  ├ monitor-diagnose.js  CPA 為什麼變貴(拆 CPM / 點擊率 / 購買率 + 行銷活動 / 年齡 / 縣市 / 變更紀錄)
  ├ monitor-asc.js       ASC / CIBS 策略(預算卡住、學習期、素材預熱、9:16)
  └ monitor-ads.js       進行中廣告 + 素材疲乏指數
  舊版整頁備份在 monitor-old.html(AI 診斷、去年同期 YoY 還在那邊)。
-->
<style>
html,body{overflow:auto;height:auto}
body{
  background-image:
    radial-gradient(ellipse at 15% 5%, rgba(124,109,250,0.10) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 90%, rgba(250,109,155,0.08) 0%, transparent 45%) !important;
  background-attachment:fixed !important;
}
.mn-top{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,10,18,0.72);border-bottom:1px solid var(--line)}
.mn-nav{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.mn-nav img{height:30px;width:auto}
.mn-nav .tt{font-size:13px;font-weight:800;color:var(--t1)}
.mn-nav .sp{flex:1}
.mn-link{padding:5px 12px;border-radius:8px;border:1px solid var(--line);color:var(--t2);font-size:11px;text-decoration:none;white-space:nowrap}
.mn-link:hover{border-color:var(--gold);color:var(--t1)}
.mn-bar{max-width:1240px;margin:0 auto;padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mn-chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,0.03);color:var(--t2);font-size:11.5px;cursor:pointer;white-space:nowrap}
.mn-chip.on{background:linear-gradient(135deg,var(--gold,#7C6DFA),var(--pink,#FA6D9B));border-color:transparent;color:#fff;font-weight:800}
.mn-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.mn-rng{padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--t2);font-size:11px;cursor:pointer}
.mn-rng.on{border-color:var(--gold);color:var(--t1);background:rgba(124,109,250,0.14);font-weight:700}
.mn-date{padding:4px 7px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,0.3);color:#fff;font-size:11px;color-scheme:dark}
.mn-meta{margin-left:auto;font-size:10.5px;color:var(--t3);display:flex;gap:8px;align-items:center;white-space:nowrap}
.mn-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--gold);background:rgba(124,109,250,0.12);color:var(--t1);font-size:11px;cursor:pointer}
.mn-tabs{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.mn-tab{padding:8px 14px;font-size:11.5px;color:var(--t3);text-decoration:none;border-bottom:2px solid transparent}
.mn-tab.on{color:var(--t1);border-bottom-color:var(--gold);font-weight:700}
.mn-wrap{max-width:1240px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:22px}
.mn-sec h2{font-size:15px;font-weight:800;color:var(--t1);margin:0 0 10px;scroll-margin-top:150px}
.mn-err{display:none;padding:12px 14px;border-radius:11px;background:rgba(250,109,155,0.1);border:1px solid rgba(250,109,155,0.35);color:var(--t1);font-size:12px}
.mn-smr{display:none;padding:10px 14px;border-radius:11px;background:rgba(109,250,194,0.07);border:1px solid rgba(109,250,194,0.25);font-size:11.5px;color:var(--t2)}
.mn-smr a{color:var(--mint,#6DFAC2);font-weight:700}
.mn-loading{display:none;position:fixed;left:0;right:0;top:150px;bottom:0;z-index:40;background:rgba(8,8,14,0.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:flex-start;justify-content:center;padding-top:8vh}
.mn-loading.on{display:flex}
.mn-loading>div{width:min(420px,90vw)}
.mn-foot{text-align:center;font-size:10px;color:var(--t3);padding:10px}
@media(max-width:640px){.mn-meta{margin-left:0;width:100%}.mn-sep{display:none}.mn-nav .tt{display:none}}
</style>
</head>
<body>
<div class="mn-top">
  <div class="mn-nav">
    <img src="logo.webp" alt="Brand OS" onerror="this.style.display='none'">
    <span class="tt">廣告監控</span>
    <span class="sp"></span>
    <a class="mn-link" href="index.html">← 回首頁</a>
    <a class="mn-link" id="mnOld" href="monitor-old.html" style="display:none">舊版監控</a>
    <a class="mn-link" id="mnAdmin" href="admin.html" style="display:none">後台</a>
  </div>
  <div class="mn-bar">
    <div id="mnBrands" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <span class="mn-sep"></span>
    <button class="mn-rng" data-r="today">今天</button>
    <button class="mn-rng" data-r="yesterday">昨天</button>
    <button class="mn-rng" data-r="7d">近 7 天</button>
    <button class="mn-rng" data-r="14d">近 14 天</button>
    <button class="mn-rng" data-r="30d">近 30 天</button>
    <input class="mn-date" type="date" id="mnSince"><span style="color:var(--t3);font-size:10px">~</span><input class="mn-date" type="date" id="mnUntil">
    <div class="mn-meta"><span id="mnUpd">載入中…</span><button class="mn-btn" id="mnRefresh">🔄 重抓最新</button></div>
  </div>
  <div class="mn-tabs">
    <a class="mn-tab on" href="#sec-overview">總覽</a>
    <a class="mn-tab" href="#sec-diag">CPA 診斷</a>
    <a class="mn-tab" href="#sec-asc">ASC / CIBS 策略</a>
    <a class="mn-tab" href="#sec-ads">進行中廣告</a>
  </div>
</div>

<div class="mn-loading" id="mnLoading"><div id="mnLoadingBox"></div></div>
<div class="mn-wrap">
  <div class="mn-err" id="mnErr"></div>
  <div class="mn-smr" id="mnSmr">🧾 這個品牌有接 SMR:Meta 回報的營收會灌水(像素重複算),<b>真實成交、口袋錢以 SMR 為準</b> → <a href="https://smr.raby.com.tw/" target="_blank" rel="noopener">打開 SMR 真實成交</a></div>
  <section class="mn-sec"><h2 id="sec-overview">📊 總覽</h2><div id="mon-overview"></div></section>
  <section class="mn-sec"><h2 id="sec-diag">🩺 CPA 為什麼變貴</h2><div id="mon-diag"></div></section>
  <section class="mn-sec"><h2 id="sec-asc">🎯 ASC / CIBS 策略</h2><div id="mon-asc"></div></section>
  <section class="mn-sec"><h2 id="sec-ads">📋 進行中廣告</h2><div id="mon-ads"></div></section>
  <div class="mn-foot" id="mnFoot"></div>
</div>

<script src="monitor-data.js?v=1.3"></script>
<script src="monitor-overview.js?v=1.3"></script>
<script src="monitor-diagnose.js?v=1.1"></script>
<script src="monitor-asc.js?v=1.0"></script>
<script src="monitor-ads.js?v=1.0"></script>
<script>
(function () {
  var M = window.MON;
  if (!M) { document.getElementById('mnErr').style.display = 'block'; document.getElementById('mnErr').textContent = '監控程式沒有載入成功,請重新整理'; return; }
  var $ = function (id) { return document.getElementById(id); };

  //  品牌按鈕
  function drawBrands() {
    var me = M.state.me; if (!me) return;
    $('mnBrands').innerHTML = me.brands.map(function (b) {
      return '<button class="mn-chip' + (b.id === M.state.brand ? ' on' : '') + '" data-b="' + b.id + '">' + b.name + '</button>';
    }).join('');
    var bi = M.brandInfo();
    $('mnSmr').style.display = bi && bi.hasSmr ? 'block' : 'none';
  }
  //  日期按鈕
  function drawRange() {
    var r = M.state.range || {};
    document.querySelectorAll('.mn-rng').forEach(function (b) { b.classList.toggle('on', b.dataset.r === r.preset); });
    var d = M.state.data;
    if (d && d.range) { $('mnSince').value = d.range.since; $('mnUntil').value = d.range.until; }
  }

  $('mnBrands').addEventListener('click', function (e) {
    var b = e.target.closest('[data-b]'); if (!b || b.dataset.b === M.state.brand) return;
    M.setBrand(b.dataset.b); drawBrands();
  });
  document.querySelectorAll('.mn-rng').forEach(function (b) {
    b.addEventListener('click', function () { M.setRange({ preset: b.dataset.r }); drawRange(); });
  });
  function custom() {
    var s = $('mnSince').value, u = $('mnUntil').value;
    if (s && u) { M.setRange({ since: s, until: u }); drawRange(); }
  }
  $('mnSince').addEventListener('change', custom);
  $('mnUntil').addEventListener('change', custom);
  $('mnRefresh').addEventListener('click', function () { M.refresh(); });

  //  分頁籤:捲到哪亮哪
  var tabs = document.querySelectorAll('.mn-tab');
  window.addEventListener('scroll', function () {
    var cur = 'sec-overview';
    ['sec-overview', 'sec-diag', 'sec-asc', 'sec-ads'].forEach(function (id) { var el = $(id); if (el && el.getBoundingClientRect().top < 200) cur = id; });
    tabs.forEach(function (t) { t.classList.toggle('on', t.getAttribute('href') === '#' + cur); });
  }, { passive: true });

  M.on('me', function (me) {
    var boss = me.all || me.role === 'owner' || me.role === 'reviewer';
    $('mnOld').style.display = boss ? '' : 'none';
    $('mnAdmin').style.display = boss ? '' : 'none';
    drawBrands(); drawRange();
  });
  //  太空人 Loading:讀取時蓋住內容區,資料到了 / 出錯就收起來
  function showLoading() {
    var bi = M.brandInfo();
    if (window.showSpaceLoader) showSpaceLoader('mnLoadingBox', '正在讀取' + (bi ? ' ' + bi.name + ' ' : '') + '的廣告數據');
    $('mnLoading').classList.add('on');
  }
  function hideLoading() { $('mnLoading').classList.remove('on'); }
  M.on('loading', function () { $('mnUpd').textContent = '讀取中…'; $('mnErr').style.display = 'none'; showLoading(); });
  M.on('data', function (d) {
    hideLoading();
    if (!d.warn) $('mnErr').style.display = 'none';
    var t = new Date(d.fetchedAt);
    $('mnUpd').textContent = (d.stale ? '上次的 ' : d.cached ? '暫存 ' : '最新 ') + t.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) + (d.loadMs != null && d.loadMs > 50 ? ' · ' + (d.loadMs / 1000).toFixed(1) + ' 秒' : '');
    $('mnFoot').textContent = M.version + ' · ' + (window.MON_OVERVIEW || {}).version + ' · ' + (window.MON_DIAG || {}).version + ' · ' + (window.MON_ASC || {}).version + ' · ' + (window.MON_ADS || {}).version + ' · 資料每 5 分鐘自動更新';
    drawBrands(); drawRange();
  });
  M.on('warn', function (msg) { $('mnErr').style.display = 'block'; $('mnErr').textContent = 'ℹ️ ' + msg; });
  M.on('error', function (msg) { hideLoading(); $('mnErr').style.display = 'block'; $('mnErr').textContent = '⚠️ ' + msg; $('mnUpd').textContent = '讀取失敗'; });

  M.init();
  //  每 5 分鐘自動更新(分頁在背景時不抓)
  setInterval(function () { if (!document.hidden) M.softRefresh(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
