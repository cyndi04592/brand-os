<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOL 數字人工作室 — Brand OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#1a1a24;--border:rgba(255,255,255,0.07);--accent:#7c6dfa;--accent2:#fa6d9b;--accent3:#6dfac2;--text:#f0f0f8;--text-dim:rgba(240,240,248,0.45);--text-mid:rgba(240,240,248,0.72);--radius:14px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(124,109,250,.12) 0%,transparent 60%),radial-gradient(ellipse 40% 30% at 80% 80%,rgba(250,109,155,.08) 0%,transparent 55%);pointer-events:none;z-index:0;}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;z-index:100;}
.topbar-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--text);text-decoration:none;}
.topbar-logo span{color:var(--accent);}
.topbar-sep{width:1px;height:20px;background:var(--border);}
.topbar-title{font-size:13px;color:var(--text-dim);}
.topbar-badge{margin-left:auto;font-size:10px;font-family:'Syne',sans-serif;font-weight:700;padding:3px 10px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;}
.main{padding-top:56px;min-height:100vh;position:relative;z-index:1;}
.page-header{padding:40px 24px 24px;max-width:1100px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.page-header h1{font-family:'Syne',sans-serif;font-size:clamp(22px,3vw,32px);font-weight:800;background:linear-gradient(135deg,var(--text) 30%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-header p{margin-top:6px;font-size:13px;color:var(--text-dim);}
.layout{max-width:1100px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:340px 1fr;gap:20px;}
@media(max-width:768px){.layout{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;}
.panel::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,109,250,.04) 0%,transparent 60%);pointer-events:none;}
.panel-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.panel-title .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}

/* KOL 形象庫 */
.kol-list{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto;}
.kol-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;position:relative;}
.kol-card:hover{border-color:rgba(124,109,250,.4);}
.kol-card.selected{border-color:var(--accent);background:rgba(124,109,250,.08);}
.kol-avatar{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--surface);flex-shrink:0;}
.kol-info{flex:1;min-width:0;}
.kol-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kol-meta{font-size:11px;color:var(--text-dim);margin-top:2px;}
.kol-del{padding:4px 8px;font-size:11px;border-radius:4px;border:1px solid rgba(250,109,155,.3);background:transparent;color:var(--accent2);cursor:pointer;opacity:0;transition:opacity .2s;flex-shrink:0;}
.kol-card:hover .kol-del{opacity:1;}
.kol-empty{text-align:center;padding:32px 16px;color:var(--text-dim);font-size:13px;}

/* 新增 KOL 區 */
.add-kol-section{margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
.upload-zone{border:2px dashed rgba(124,109,250,.3);border-radius:var(--radius-sm);padding:24px 16px;text-align:center;cursor:pointer;transition:all .3s;background:rgba(124,109,250,.03);}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(124,109,250,.08);}
.upload-zone .icon{font-size:28px;margin-bottom:8px;}
.upload-zone p{font-size:12px;color:var(--text-mid);}
.upload-zone p strong{color:var(--accent);}
.upload-zone small{font-size:10px;color:var(--text-dim);display:block;margin-top:4px;}
#photo-input{display:none;}
.preview-wrap{display:none;}
.preview-wrap.show{display:block;}
.preview-img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--radius-sm);}

/* 表單 */
.form-group{display:flex;flex-direction:column;gap:5px;margin-top:12px;}
.form-label{font-size:11px;color:var(--text-dim);font-weight:500;}
.form-input,.form-select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;font-family:'Noto Sans TC',sans-serif;padding:9px 12px;outline:none;transition:border-color .2s;width:100%;}
.form-input:focus,.form-select:focus{border-color:var(--accent);}
.form-select option{background:#1a1a24;}

/* 右側：影片生成 */
.right-panel{display:flex;flex-direction:column;gap:16px;}
.selected-kol-banner{background:var(--surface2);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;gap:14px;}
.selected-kol-banner img{width:52px;height:52px;border-radius:8px;object-fit:cover;}
.selected-kol-banner .info strong{font-size:14px;display:block;}
.selected-kol-banner .info small{font-size:11px;color:var(--text-dim);}

/* 語音選擇 */
.voice-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.voice-tag{padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
.voice-tag:hover{border-color:var(--accent);}
.voice-tag.selected{background:rgba(124,109,250,.15);border-color:var(--accent);color:var(--accent);}
.voice-tag .play{opacity:.6;cursor:pointer;font-size:10px;}
.voice-tag .play:hover{opacity:1;}

/* 場景 */
.scene-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
@media(max-width:500px){.scene-grid{grid-template-columns:repeat(2,1fr);}}
.scene-card{border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);overflow:hidden;cursor:pointer;transition:all .2s;}
.scene-card:hover{border-color:rgba(124,109,250,.5);}
.scene-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,109,250,.2);}
.scene-thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:20px;}
.scene-info{padding:6px 8px;font-size:11px;color:var(--text-dim);}

/* 腳本 */
.script-wrap{position:relative;}
.script-wrap textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;font-family:'Noto Sans TC',sans-serif;padding:10px 12px;outline:none;resize:vertical;min-height:120px;line-height:1.6;}
.script-wrap textarea:focus{border-color:var(--accent);}
.char-count{position:absolute;bottom:8px;right:10px;font-size:10px;color:var(--text-dim);pointer-events:none;}

/* 影片任務 */
.video-task{background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-top:10px;}
.video-task-info{flex:1;}
.video-task-info strong{font-size:13px;display:block;}
.video-task-info small{font-size:11px;color:var(--text-dim);}
.task-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.task-badge.processing{background:rgba(124,109,250,.15);color:var(--accent);}
.task-badge.completed{background:rgba(109,250,194,.12);color:var(--accent3);}
.task-badge.failed{background:rgba(250,109,155,.12);color:var(--accent2);}

/* 進度 */
.progress-bar{height:3px;background:var(--surface2);border-radius:10px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .4s;}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:none;transition:all .2s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--accent),#9c8dff);color:white;box-shadow:0 4px 16px rgba(124,109,250,.3);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(124,109,250,.4);}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-ghost{background:var(--surface2);color:var(--text-mid);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);color:var(--text);}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-full{width:100%;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

/* Toast */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:9px 18px;font-size:13px;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.4);animation:tIn .3s ease,tOut .3s ease 2.7s forwards;white-space:nowrap;}
.toast.success{border-color:var(--accent3);}
.toast.error{border-color:var(--accent2);}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes tOut{to{opacity:0;transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.chip{font-size:10px;font-family:'Syne',sans-serif;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(124,109,250,.15);color:var(--accent);text-transform:uppercase;}
.chip.green{background:rgba(109,250,194,.12);color:var(--accent3);}
.chip.orange{background:rgba(255,169,77,.15);color:#ffa94d;}
</style>
</head>
<body>
<header class="topbar">
  <a class="topbar-logo" href="index.html">Brand <span>OS</span></a>
  <div class="topbar-sep"></div>
  <span class="topbar-title">KOL 數字人工作室</span>
  <div class="topbar-badge">BETA</div>
</header>

<main class="main">
  <div class="page-header">
    <div>
      <h1>KOL 數字人工作室</h1>
      <p>管理你的 KOL 形象庫，一鍵生成口播影片</p>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="loadKolList()">🔄 重新載入形象庫</button>
  </div>

  <div class="layout">
    <!-- 左側：KOL 形象庫 -->
    <div class="panel">
      <div class="panel-title"><div class="dot"></div>KOL 形象庫</div>

      <div class="kol-list" id="kol-list">
        <div class="kol-empty">載入中…</div>
      </div>

      <div class="add-kol-section">
        <div class="panel-title" style="margin-bottom:12px"><div class="dot" style="background:var(--accent2)"></div>新增 KOL</div>

        <!-- 照片上傳 -->
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('photo-input').click()">
          <div class="icon">📸</div>
          <p><strong>點擊上傳照片</strong> 或拖曳</p>
          <small>正面清晰 · 背景乾淨 · JPG/PNG</small>
        </div>
        <div class="preview-wrap" id="preview-wrap">
          <img class="preview-img" id="preview-img" src="" alt="">
          <button class="btn btn-ghost btn-sm btn-full" style="margin-top:8px" onclick="resetPhoto()">🔄 重選</button>
        </div>
        <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp">

        <div class="form-group">
          <label class="form-label">KOL 名稱</label>
          <input class="form-input" id="kol-name" type="text" placeholder="例：芮比 Raby" maxlength="20">
        </div>
        <div class="form-group">
          <label class="form-label">所屬品牌</label>
          <select class="form-select" id="kol-brand">
            <option value="">— 選擇品牌 —</option>
            <option value="moz">MOZ 瑞典駝鹿</option>
            <option value="lacez">LACEZ</option>
            <option value="wangwei">旺味</option>
            <option value="kongma">空馬</option>
            <option value="qiaofu">巧福</option>
            <option value="radesign">RADESIGN</option>
          </select>
        </div>

        <div id="upload-progress" style="display:none;margin-top:10px">
          <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px" id="upload-label">上傳中…</div>
          <div class="progress-bar"><div class="progress-fill" id="upload-fill" style="width:0%"></div></div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary btn-full" id="add-btn" onclick="addKol()" disabled>➕ 建立 KOL 形象</button>
        </div>
      </div>
    </div>

    <!-- 右側：影片生成 -->
    <div class="right-panel">

      <!-- 已選 KOL -->
      <div class="panel">
        <div class="panel-title"><div class="dot" style="background:var(--accent3)"></div>目前選定的 KOL</div>
        <div id="selected-kol-banner">
          <div class="kol-empty" style="padding:16px">← 從左側選擇一個 KOL 形象</div>
        </div>
      </div>

      <!-- 口播設定 -->
      <div class="panel" id="video-panel">
        <div class="panel-title"><div class="dot" style="background:var(--accent2)"></div>口播影片設定</div>

        <!-- 語音 -->
        <div class="form-label">口播音色</div>
        <div class="voice-grid" id="voice-grid">
          <div style="font-size:12px;color:var(--text-dim)">載入中…</div>
        </div>

        <div class="divider"></div>

        <!-- 場景 -->
        <div class="form-label">影片場景</div>
        <div class="scene-grid">
          <div class="scene-card selected" data-scene="product"><div class="scene-thumb" style="background:linear-gradient(135deg,#1a1a2e,#2a2a4e)">🛍️</div><div class="scene-info">產品開箱</div></div>
          <div class="scene-card" data-scene="review"><div class="scene-thumb" style="background:linear-gradient(135deg,#1a2e1a,#2a4e2a)">⭐</div><div class="scene-info">使用心得</div></div>
          <div class="scene-card" data-scene="promo"><div class="scene-thumb" style="background:linear-gradient(135deg,#2e1a1a,#4e2a2a)">🔥</div><div class="scene-info">限時優惠</div></div>
          <div class="scene-card" data-scene="edu"><div class="scene-thumb" style="background:linear-gradient(135deg,#1a2e2e,#2a4e4e)">💡</div><div class="scene-info">教育知識</div></div>
        </div>

        <div class="divider"></div>

        <!-- 主題 -->
        <div class="form-group" style="margin-top:0">
          <label class="form-label">影片主題 / 賣點</label>
          <input class="form-input" id="video-topic" type="text" placeholder="例：MOZ 鞋款緩震科技，久站不累的秘密">
        </div>

        <!-- 腳本 -->
        <div class="form-group">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <label class="form-label" style="margin:0">口播腳本</label>
            <button class="btn btn-ghost btn-sm" id="gen-btn" onclick="generateScript()">✨ AI 生成</button>
          </div>
          <div class="script-wrap" style="margin-top:6px">
            <textarea id="script-output" placeholder="點 AI 生成，或直接輸入口播稿…"></textarea>
            <span class="char-count" id="script-count">0 字</span>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="create-video-btn" onclick="createVideo()" disabled>🎬 生成口播影片</button>
          <button class="btn btn-ghost btn-sm" onclick="copyScript()">📋 複製腳本</button>
        </div>

        <!-- 影片任務 -->
        <div id="video-tasks"></div>
      </div>
    </div>
  </div>
</main>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
// ══ CONFIG ══
const WORKER   = 'https://kol-proxy.calm-sunset-6b66.workers.dev';
const PASSWORD = 'raby2026';

// ══ 狀態 ══
const S = {
  photoFile: null,
  photoMime: null,
  selectedKol: null,   // { id, name, brand, image_url, talking_photo_id }
  voices: [],
  videoTasks: [],
};

// ══ Worker 呼叫 ══
async function api(action, extra = {}) {
  const r = await fetch(WORKER, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: PASSWORD, action, ...extra }),
  });
  return r.json();
}

// ══ 初始化 ══
(async function init() {
  await Promise.all([loadKolList(), loadVoices()]);
})();

// ══ KOL 形象庫 ══
async function loadKolList() {
  document.getElementById('kol-list').innerHTML = '<div class="kol-empty">載入中…</div>';
  const res = await api('heygen_list_groups');
  if (!res.ok) {
    document.getElementById('kol-list').innerHTML = `<div class="kol-empty">載入失敗：${res.error}</div>`;
    return;
  }
  if (!res.groups?.length) {
    document.getElementById('kol-list').innerHTML = '<div class="kol-empty">尚無 KOL 形象，從下方新增</div>';
    return;
  }
  document.getElementById('kol-list').innerHTML = res.groups.map(g => `
    <div class="kol-card" id="kol-${g.id}" onclick="selectKol(${JSON.stringify(g).replace(/"/g,'&quot;')})">
      <img class="kol-avatar" src="${g.image_url||''}" onerror="this.style.display='none'" alt="">
      <div class="kol-info">
        <div class="kol-name">${g.name}</div>
        <div class="kol-meta">ID: ${g.id.slice(0,12)}…</div>
      </div>
      <button class="kol-del" onclick="event.stopPropagation();deleteKol('${g.id}','${g.name}')">🗑</button>
    </div>
  `).join('');
}

function selectKol(g) {
  S.selectedKol = g;
  document.querySelectorAll('.kol-card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById('kol-' + g.id);
  if (card) card.classList.add('selected');
  document.getElementById('selected-kol-banner').innerHTML = `
    <div class="selected-kol-banner">
      <img src="${g.image_url||''}" onerror="this.style.display='none'" alt="">
      <div class="info">
        <strong>${g.name}</strong>
        <small>talking_photo_id: ${g.id}</small>
      </div>
      <span class="chip green">已選定</span>
    </div>
  `;
  document.getElementById('create-video-btn').disabled = false;
  toast(`已選定：${g.name}`, 'success');
}

async function deleteKol(id, name) {
  if (!confirm(`確定刪除「${name}」？此操作無法復原。`)) return;
  const res = await api('heygen_delete_group', { group_id: id });
  if (res.ok) { toast(`已刪除 ${name}`, 'success'); loadKolList(); }
  else toast('刪除失敗：' + res.error, 'error');
}

// ══ 新增 KOL ══
document.getElementById('photo-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (f) handlePhoto(f);
});
const zone = document.getElementById('upload-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('dragover'); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) handlePhoto(f); });

function handlePhoto(file) {
  S.photoFile = file; S.photoMime = file.type || 'image/jpeg';
  const r = new FileReader();
  r.onload = e => {
    document.getElementById('preview-img').src = e.target.result;
    zone.style.display = 'none';
    document.getElementById('preview-wrap').classList.add('show');
    document.getElementById('add-btn').disabled = false;
  };
  r.readAsDataURL(file);
}

function resetPhoto() {
  S.photoFile = null;
  document.getElementById('photo-input').value = '';
  document.getElementById('preview-img').src = '';
  document.getElementById('preview-wrap').classList.remove('show');
  zone.style.display = '';
  document.getElementById('add-btn').disabled = true;
}

async function addKol() {
  if (!S.photoFile) { toast('請先上傳照片', 'error'); return; }
  const name = document.getElementById('kol-name').value.trim();
  if (!name) { toast('請輸入 KOL 名稱', 'error'); return; }

  const btn = document.getElementById('add-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spin">⏳</span> 處理中…';
  showProgress(true, '上傳照片中…', 20);

  try {
    // Step 1: 上傳照片
    const upResp = await fetch(WORKER + '/upload', {
      method: 'POST',
      headers: { 'Content-Type': S.photoMime, 'X-Password': PASSWORD },
      body: S.photoFile,
    });
    const upRes = await upResp.json();
    if (!upRes.ok) throw new Error(upRes.error);

    showProgress(true, '建立 KOL 形象…', 60);

    // Step 2: 建立 Avatar Group（group_id = talking_photo_id）
    const grpRes = await api('heygen_create_group', { name, image_key: upRes.image_key });
    if (!grpRes.ok) throw new Error(grpRes.error);

    showProgress(true, '完成！', 100);
    await delay(400); showProgress(false);

    toast(`KOL「${name}」建立成功！`, 'success');
    resetPhoto();
    document.getElementById('kol-name').value = '';
    await loadKolList();

    // 自動選定新建的 KOL
    selectKol({ id: grpRes.group_id, name, image_url: grpRes.image_url, talking_photo_id: grpRes.talking_photo_id });

  } catch (e) {
    toast('失敗：' + e.message, 'error');
    showProgress(false);
  }
  btn.disabled = false; btn.textContent = '➕ 建立 KOL 形象';
}

function showProgress(show, label, pct) {
  const w = document.getElementById('upload-progress');
  w.style.display = show ? 'block' : 'none';
  if (show) { document.getElementById('upload-label').textContent = label; document.getElementById('upload-fill').style.width = pct + '%'; }
}

// ══ 語音載入 ══
async function loadVoices() {
  const res = await api('heygen_list_voices');
  if (!res.ok || !res.voices?.length) return;
  S.voices = res.voices;
  const grid = document.getElementById('voice-grid');
  grid.innerHTML = res.voices.slice(0, 12).map((v, i) => `
    <div class="voice-tag ${i === 0 ? 'selected' : ''}" data-id="${v.id}" onclick="selectVoice(this,'${v.id}')">
      ${v.name}
      <span class="chip" style="font-size:9px">${(v.language||'').replace('Chinese','中').replace('Japanese','日').replace('English','英').replace('Multilingual','多').replace('Cantonese','粵')}</span>
      ${v.preview_url ? `<span class="play" onclick="event.stopPropagation();new Audio('${v.preview_url}').play()">▶</span>` : ''}
    </div>
  `).join('');
}

function selectVoice(el, id) {
  document.querySelectorAll('.voice-tag').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');
}

// ══ 場景選擇 ══
document.querySelectorAll('.scene-card').forEach(c => {
  c.addEventListener('click', () => { document.querySelectorAll('.scene-card').forEach(x => x.classList.remove('selected')); c.classList.add('selected'); });
});

// ══ AI 腳本生成 ══
async function generateScript() {
  const topic = document.getElementById('video-topic').value.trim();
  if (!topic) { toast('請輸入影片主題', 'error'); return; }
  const kolName = S.selectedKol?.name || document.getElementById('kol-name').value.trim() || 'KOL';
  const brandEl = document.getElementById('kol-brand');
  const brand = brandEl.options[brandEl.selectedIndex].text;
  const scene = document.querySelector('.scene-card.selected')?.dataset.scene || 'product';
  const sceneMap = { product:'產品開箱', review:'使用心得', promo:'限時優惠', edu:'教育知識' };

  const btn = document.getElementById('gen-btn');
  btn.disabled = true; btn.textContent = '生成中…';
  document.getElementById('script-output').value = '';

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 600,
        system: `你是品牌廣告文案專家，寫短影音口播腳本。直接輸出腳本，不要任何說明或標題。`,
        messages: [{ role: 'user', content: `寫一段短影音口播腳本（30秒，約100字）。\nKOL：${kolName}\n品牌：${brand}\n場景：${sceneMap[scene]}\n主題：${topic}\n要求：開場 Hook、中間產品亮點、結尾 CTA，全程口語化。` }]
      })
    });
    const data = await resp.json();
    const text = data.content?.[0]?.text || '（生成失敗）';
    document.getElementById('script-output').value = text;
    document.getElementById('script-count').textContent = text.length + ' 字';
    toast('腳本生成完成 ✓', 'success');
  } catch (e) { toast('腳本生成失敗', 'error'); }
  btn.disabled = false; btn.textContent = '✨ AI 生成';
}

document.getElementById('script-output').addEventListener('input', function() {
  document.getElementById('script-count').textContent = this.value.length + ' 字';
});

function copyScript() {
  const t = document.getElementById('script-output').value;
  if (!t) { toast('尚無腳本', 'error'); return; }
  navigator.clipboard.writeText(t).then(() => toast('已複製 ✓', 'success'));
}

// ══ 影片生成 ══
async function createVideo() {
  if (!S.selectedKol) { toast('請先選定 KOL 形象', 'error'); return; }
  const script = document.getElementById('script-output').value.trim();
  if (!script) { toast('請先輸入腳本', 'error'); return; }
  const voiceId = document.querySelector('.voice-tag.selected')?.dataset.id || '';
  const talking_photo_id = S.selectedKol.talking_photo_id || S.selectedKol.id;

  const btn = document.getElementById('create-video-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spin">⏳</span> 送出中…';

  try {
    const res = await api('heygen_create_video', { talking_photo_id, script, voice_id: voiceId, ratio: '9:16' });
    if (!res.ok) throw new Error(res.error);

    const task = { video_id: res.video_id, label: document.getElementById('video-topic').value.trim() || '口播影片', status: 'processing', created: new Date().toLocaleTimeString('zh-TW'), url: null };
    S.videoTasks.unshift(task);
    renderTasks();
    toast('影片生成任務已送出 🎬', 'success');
    pollVideo(task);
  } catch (e) { toast('失敗：' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = '🎬 生成口播影片';
}

async function pollVideo(task) {
  let count = 0;
  const t = setInterval(async () => {
    if (++count > 60) { clearInterval(t); task.status = 'failed'; renderTasks(); return; }
    try {
      const res = await api('heygen_video_status', { video_id: task.video_id });
      if (!res.ok) return;
      task.status = res.status; if (res.video_url) task.url = res.video_url;
      renderTasks();
      if (res.status === 'completed' || res.status === 'failed') {
        clearInterval(t);
        if (res.status === 'completed') toast('影片生成完成 ✓', 'success');
      }
    } catch {}
  }, 15000);
}

function renderTasks() {
  document.getElementById('video-tasks').innerHTML = S.videoTasks.map(t => `
    <div class="video-task">
      <div class="video-task-info"><strong>${t.label}</strong><small>${t.created} · ${t.video_id}</small></div>
      <span class="task-badge ${t.status}">${t.status === 'processing' ? '渲染中…' : t.status === 'completed' ? '完成 ✓' : t.status === 'failed' ? '失敗' : t.status}</span>
      ${t.url ? `<a href="${t.url}" target="_blank" class="btn btn-ghost btn-sm">▶ 播放</a>` : ''}
    </div>
  `).join('');
}

// ══ 工具 ══
function toast(msg, type = '') {
  const el = Object.assign(document.createElement('div'), { className: `toast ${type}`, textContent: msg });
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 3100);
}
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
