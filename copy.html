<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand OS · 文案生成</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#1C1C1E;--bg2:#242426;--bg3:#2C2C2E;--bg4:#343436;
  --gold:#E8603A;--gold2:rgba(232,96,58,0.15);--gold3:rgba(232,96,58,0.06);
  --red:#E8603A;--red2:rgba(232,96,58,0.12);
  --sky:#5BC8C8;--sky2:rgba(91,200,200,0.12);
  --mint:#7ED4B0;--mint2:rgba(126,212,176,0.12);
  --peach:#E8603A;--peach2:rgba(232,96,58,0.12);
  --purple:#B89ED4;--purple2:rgba(184,158,212,0.12);
  --line:rgba(255,255,255,0.08);--line2:rgba(232,96,58,0.25);
  --t1:#F5F5F5;--t2:#A0A0A8;--t3:#606068;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--t1);font-family:'Noto Sans TC',sans-serif;display:flex;flex-direction:column;font-size:14px;}

/* ── NAV ── */
.nav{height:52px;background:rgba(20,20,20,0.98);border-bottom:1px solid rgba(232,96,58,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:10px;}
.nav-logo{font-family:'Bebas Neue';font-size:19px;letter-spacing:4px;color:#E8603A;}
.nav-logo-sub{font-size:8px;color:#A08040;letter-spacing:2px;font-family:'DM Mono';}
.nav-page{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:2px;border-left:1px solid var(--line);padding-left:10px;margin-left:4px;}
.nav-brands{display:flex;gap:5px;}
.nb{padding:4px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;font-family:'Noto Sans TC';font-size:10px;font-weight:700;cursor:pointer;transition:all 0.2s;color:var(--t3);}
.nb:hover,.nb.on{border-color:var(--gold);color:var(--gold);background:var(--gold2);}
.nb.sky.on{border-color:var(--sky);color:var(--sky);background:var(--sky2);}
.nb.red.on{border-color:var(--red);color:var(--red);background:var(--red2);}
.nb.mint.on{border-color:var(--mint);color:var(--mint);background:var(--mint2);}
.nav-right{display:flex;align-items:center;gap:8px;}
.nav-btn{padding:4px 12px;border-radius:6px;font-family:'Noto Sans TC';font-size:10px;font-weight:700;cursor:pointer;transition:all 0.2s;border:1px solid;}
.btn-home{border-color:var(--line);background:var(--bg3);color:var(--t3);text-decoration:none;display:inline-flex;align-items:center;}
.btn-home:hover{border-color:var(--gold);color:var(--gold);}
.btn-admin{border-color:rgba(232,96,58,0.4);background:rgba(232,96,58,0.12);color:#E8603A;}
.btn-logout{border-color:var(--line);background:rgba(255,255,255,0.06);color:var(--t3);}
.drive-dot{width:7px;height:7px;border-radius:50%;background:var(--t3);}
.drive-dot.ok{background:var(--mint);box-shadow:0 0 6px var(--mint);}
.drive-dot.busy{background:var(--gold);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.drive-label{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:0.5px;}

/* ── WORKSPACE ── */
.workspace{flex:1;display:grid;grid-template-columns:260px 1fr 340px;overflow:hidden;}

/* ── LEFT ── */
.left{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
.l-sec{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--t3);text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.l-sec::after{content:'';flex:1;height:1px;background:var(--line);}
.brand-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg3);cursor:pointer;margin-bottom:5px;transition:all 0.2s;}
.brand-row:hover{border-color:rgba(232,96,58,0.3);transform:translateX(2px);}
.brand-row.on{border-color:var(--gold);background:var(--gold3);}
.br-icon{font-size:17px;flex-shrink:0;}
.br-name{font-size:13px;font-weight:700;}
.br-sub{font-size:10px;color:var(--t3);}
.sub-brand-row{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 26px;border-radius:6px;border:1px dashed var(--line);cursor:pointer;margin-bottom:4px;transition:all 0.2s;font-size:12px;color:var(--t3);}
.sub-brand-row:hover,.sub-brand-row.on{border-color:var(--sky);color:var(--sky);}
.sub-brand-row.on{background:var(--sky2);}
.sub-brand-row .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.prod-scroll{flex:1;overflow-y:auto;padding:12px 14px;}
.prod-scroll::-webkit-scrollbar{width:3px;}
.prod-scroll::-webkit-scrollbar-thumb{background:var(--line2);}
.prod-grp-label{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;margin-top:2px;opacity:0.6;}
.prod-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg3);cursor:pointer;margin-bottom:5px;transition:all 0.2s;}
.prod-row:hover{border-color:var(--gold);transform:translateX(2px);}
.prod-row.on{border-color:var(--gold);background:var(--gold3);}
.prod-dot{width:5px;height:5px;border-radius:50%;background:var(--t3);flex-shrink:0;}
.prod-row.on .prod-dot{background:var(--gold);}
.prod-name{font-size:12px;flex:1;}
.prod-tag{font-size:10px;color:var(--t3);}

/* ── MID ── */
.mid{display:flex;flex-direction:column;overflow:hidden;}
.gen-bar{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2);flex-shrink:0;}
.gb-row1{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.gb-ctx{flex:1;}
.gb-brand{font-size:11px;font-weight:700;letter-spacing:1px;}
.gb-prod{font-size:14px;color:var(--t1);margin-top:2px;font-weight:500;}
.sel{background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--t1);font-family:'Noto Sans TC';font-size:12px;padding:6px 9px;outline:none;}
.sel:focus{border-color:#E8603A;}
.sel-lbl{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--t3);text-transform:uppercase;margin-bottom:3px;}
.gen-btn{padding:10px 24px;background:linear-gradient(135deg,#E8603A,#C44020);border:none;border-radius:8px;color:#fff;font-family:'Noto Sans TC';font-size:13px;font-weight:900;cursor:pointer;letter-spacing:1px;transition:all 0.2s;white-space:nowrap;flex-shrink:0;}
.gen-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,96,58,0.4);}
.gen-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.prog{height:8px;background:var(--line);border-radius:4px;display:none;margin-top:6px;position:relative;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--gold));border-radius:4px;width:0%;transition:width 0.4s;}
.prog-pct{position:absolute;right:0;top:-18px;font-size:10px;font-weight:900;color:#E8603A;font-family:'DM Mono';}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2);flex-shrink:0;}
.tab{padding:10px 16px;font-size:11px;font-weight:700;color:var(--t3);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:'Noto Sans TC';transition:all 0.2s;letter-spacing:0.5px;}
.tab:hover{color:var(--t1);}
.tab.on{color:#E8603A;border-bottom-color:#E8603A;}
.badge{font-size:9px;background:rgba(232,96,58,0.15);color:#E8603A;border-radius:10px;padding:1px 6px;margin-left:5px;font-weight:900;}
.scripts-wrap{flex:1;overflow-y:auto;padding:14px 18px;}
.scripts-wrap::-webkit-scrollbar{width:4px;}
.scripts-wrap::-webkit-scrollbar-thumb{background:var(--line2);}
.pane{display:none;}
.pane.on{display:block;}
.ad-card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden;animation:up 0.2s ease both;}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ac-top{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--bg3);border-bottom:1px solid var(--line);}
.ac-id{font-family:'DM Mono';font-size:12px;color:#E8603A;}
.ac-pill{font-size:10px;padding:3px 9px;border-radius:3px;font-weight:700;}
.ac-body{display:grid;grid-template-columns:1fr 1fr 1fr;}
.seg{padding:9px 11px;border-right:1px solid var(--line);}
.seg:last-child{border-right:none;}
.seg-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
.seg-txt{font-size:12px;line-height:1.8;}
.seg-badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;margin-top:4px;font-weight:700;letter-spacing:1px;}
.seg-hint{font-size:10px;color:var(--t3);margin-top:5px;}
.tbtn{padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;font-weight:700;border:1px solid;background:transparent;transition:all 0.2s;font-family:'Noto Sans TC';}
.tbtn-g{border-color:var(--line);color:var(--t3);}
.tbtn-g:hover{border-color:var(--gold);color:var(--gold);}
.tbtn-s{border-color:var(--sky);color:var(--sky);background:var(--sky2);}
.empty{text-align:center;padding:40px 20px;color:var(--t3);}
.empty-ico{font-size:34px;opacity:0.2;margin-bottom:8px;}
.empty-h{font-size:13px;color:rgba(240,240,255,0.08);font-family:'Bebas Neue';letter-spacing:2px;}
.empty-p{font-size:10px;line-height:1.8;margin-top:6px;}
.spin{display:inline-block;width:10px;height:10px;border:2px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:sp 0.6s linear infinite;vertical-align:middle;margin-right:4px;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── RIGHT ── */
.right{background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
.drive-cfg{padding:14px 14px 10px;border-bottom:1px solid var(--line);flex-shrink:0;}
.dcfg-row{display:flex;gap:5px;margin-bottom:6px;}
.dcfg-input{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--t1);font-family:'Noto Sans TC';font-size:11px;padding:6px 10px;outline:none;min-width:0;}
.dcfg-input:focus{border-color:var(--sky);}
.dcfg-input::placeholder{color:var(--t3);}
.fetch-btn{padding:6px 11px;border-radius:6px;font-family:'Noto Sans TC';font-size:10px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;border:1px solid;flex-shrink:0;}
.fetch-sky{background:var(--sky2);color:var(--sky);border-color:var(--sky);}
.fetch-sky:hover{background:rgba(77,200,240,0.22);}
.fetch-sky:disabled{opacity:0.4;cursor:not-allowed;}
.asset-grid{flex:1;overflow-y:auto;padding:10px 12px;}
.asset-grid::-webkit-scrollbar{width:3px;}
.asset-grid::-webkit-scrollbar-thumb{background:var(--line2);}
.asset-sec{margin-bottom:12px;}
.asset-sec-lbl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--t3);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.asset-count{font-size:10px;font-weight:700;font-family:'DM Mono';}
.asset-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg3);cursor:pointer;margin-bottom:4px;transition:all 0.2s;}
.asset-item:hover{border-color:var(--sky);}
.asset-item.on.photo{border-color:var(--sky);background:var(--sky2);}
.asset-item.on.video{border-color:var(--peach);background:var(--peach2);}
.ai-thumb{width:34px;height:34px;border-radius:5px;overflow:hidden;flex-shrink:0;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:14px;}
.ai-thumb img{width:100%;height:100%;object-fit:contain;}
.ai-info{flex:1;min-width:0;}
.ai-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ai-meta{font-size:10px;color:var(--t3);margin-top:1px;}
.ai-check{font-size:12px;opacity:0;transition:opacity 0.15s;flex-shrink:0;}
.asset-item.on .ai-check{opacity:1;}
.asset-item.on.photo .ai-check{color:var(--sky);}
.asset-item.on.video .ai-check{color:var(--peach);}
.deliver-zone{border-top:1.5px solid var(--line2);flex-shrink:0;background:var(--bg3);}
.dz-head{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;}
.dz-title{font-size:10px;font-weight:900;color:#E8603A;letter-spacing:1.5px;}
.dz-sub{font-size:9px;color:var(--t3);}
.dz-body{max-height:210px;overflow-y:auto;}
.dz-body::-webkit-scrollbar{width:3px;}
.dz-body::-webkit-scrollbar-thumb{background:var(--line2);}
.dr{display:grid;grid-template-columns:30px 1fr auto auto auto;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);transition:background 0.2s;}
.dr:hover{background:rgba(255,255,255,0.02);}
.dr-id{font-family:'DM Mono';font-size:9px;color:#E8603A;}
.dr-script{font-size:11px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asset-link{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;text-decoration:none;transition:all 0.2s;}
.al-photo{color:var(--sky);background:var(--sky2);border:1px solid var(--sky);}
.al-video{color:var(--peach);background:var(--peach2);border:1px solid var(--peach);}
.al-none{color:var(--t3);background:transparent;border:1px solid var(--line);cursor:default;}
.dr-status{font-size:8px;padding:2px 6px;border-radius:3px;font-weight:700;letter-spacing:1px;white-space:nowrap;}
.ds-ready{color:var(--mint);background:var(--mint2);}
.ds-missing{color:var(--peach);background:var(--peach2);}
.dz-footer{padding:8px 10px;display:flex;gap:6px;}
.dz-copy{flex:1;padding:8px;border-radius:7px;font-family:'Noto Sans TC';font-size:12px;font-weight:900;cursor:pointer;background:rgba(232,96,58,0.12);color:#E8603A;border:1px solid #E8603A;transition:all 0.2s;}
.dz-clear{padding:8px 12px;border-radius:7px;font-family:'Noto Sans TC';font-size:12px;font-weight:700;cursor:pointer;background:var(--red2);color:var(--red);border:1px solid rgba(212,24,46,0.4);transition:all 0.2s;}
.drive-warning-text{animation:driveFlash 1.5s ease infinite;}
@keyframes driveFlash{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes hlNew{from{background:rgba(61,214,140,0.08)}to{background:transparent}}
.dr.new{animation:hlNew 1.2s ease;}

@media(max-width:768px){
  html,body{overflow:auto;}
  .workspace{display:flex;flex-direction:column;overflow:visible;height:auto;}
  .left,.mid,.right{width:100%;}
  .left{border-right:none;border-bottom:1px solid var(--line);}
  .right{border-left:none;border-top:1px solid var(--line);}
  .nav{height:auto;flex-wrap:wrap;padding:8px 14px;gap:8px;}
  .nav-brands{flex-wrap:wrap;width:100%;order:3;}
  .gb-row1{flex-wrap:wrap;gap:8px;}
  .gen-btn{width:100%;}
  .ac-body{grid-template-columns:1fr;}
  .seg{border-right:none;border-bottom:1px solid var(--line);}
  .seg:last-child{border-bottom:none;}
  .dz-body{max-height:300px;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <img src="logo.webp" alt="logo" style="height:32px;width:auto;object-fit:contain;">
    <div style="display:flex;flex-direction:column;line-height:1;">
      <span class="nav-logo">Brand OS</span>
      <span class="nav-logo-sub">RABY D&amp;C · v5</span>
    </div>
    <span class="nav-page">⚡ 文案生成</span>
  </div>
  <div class="nav-brands" id="navBrands"></div>
  <div class="nav-right">
    <a class="nav-btn btn-home" href="index.html">首頁</a>
    <button class="nav-btn btn-admin" onclick="goAdmin()">⚙️ 後台</button>
    <button class="nav-btn btn-logout" id="logoutBtn" onclick="doLogout()">登出</button>
    <button id="driveLoginBtn" onclick="driveLogin()" class="nav-btn" style="border-color:var(--sky);background:var(--sky2);color:var(--sky);">· 連結 Drive</button>
    <div class="drive-dot" id="driveDot"></div>
    <span class="drive-label drive-warning-text" id="driveLabel">· 未連結</span>
  </div>
</nav>

<div class="workspace">
<!-- LEFT：品牌/商品 -->
<div class="left">
  <div style="padding:12px 14px 6px;flex-shrink:0;"><div class="l-sec">品牌 · 商品</div></div>
  <div style="overflow-y:auto;padding:0 14px 10px;border-bottom:1px solid var(--line);flex-shrink:0;max-height:52%;">
    <div id="brandTree"></div>
  </div>
  <div class="prod-scroll" id="prodList">
    <div class="empty" style="padding:24px 10px;"><div class="empty-p">← 選品牌 再選商品</div></div>
  </div>
</div>

<!-- MID：生成區 -->
<div class="mid">
  <div class="gen-bar">
    <div class="gb-row1">
      <div class="gb-ctx">
        <div class="gb-brand" id="gbBrand" style="color:var(--t3)">尚未選擇品牌</div>
        <div class="gb-prod" id="gbProd" style="color:var(--t3)">← 先選商品</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div class="sel-lbl">目標受眾</div>
        <select class="sel" id="selAud">
          <option>媽媽族群／家庭主婦</option><option>新手爸媽／育兒家庭</option><option>銀髮族／養生族</option>
          <option>上班族／久坐族</option><option>健身運動族</option><option>Z世代零嘴族</option>
          <option>學生族群</option><option>小資族／省錢族</option><option>寵物主人</option>
          <option>居家生活愛好者</option><option>戶外露營族</option><option>美食饕客</option>
          <option>科技愛好者</option><option>一般消費者</option>
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div class="sel-lbl">組數</div>
        <select class="sel" id="selN" style="width:72px"><option>1組</option><option>5組</option><option>10組</option><option selected>20組</option></select>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div class="sel-lbl">文案長度</div>
        <select class="sel" id="selCopyLength" style="width:80px">
          <option value="short">短文案</option><option value="medium" selected>中等</option><option value="long">長文案</option>
        </select>
      </div>
      <button class="gen-btn" id="genBtn" onclick="doGenerate()">⚡ 生成腳本</button>
    </div>
    <div class="prog" id="prog">
      <div class="prog-fill" id="progFill"></div>
      <span class="prog-pct" id="progPct"></span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="scripts" onclick="switchTab(this)">廣告腳本 <span class="badge" id="scriptBadge">0</span></button>
    <button class="tab" data-tab="deliver" onclick="switchTab(this)">投手交付表 <span class="badge" id="deliverBadge">0</span></button>
  </div>
  <div class="scripts-wrap">
    <div class="pane on" id="pane-scripts">
      <div id="scriptsOut">
        <div class="empty"><div class="empty-ico">·</div><div class="empty-h">等待生成</div><div class="empty-p">選好品牌商品後<br>點「⚡ 生成腳本」</div></div>
      </div>
    </div>
    <div class="pane" id="pane-deliver">
      <div style="padding:10px 0 14px">
        <div id="deliverOut"><div class="empty"><div class="empty-p">腳本生成後，右側選好素材，點「＋加入交付」</div></div></div>
      </div>
    </div>
  </div>
</div>

<!-- RIGHT：素材 + 交付 -->
<div class="right">
  <div class="drive-cfg">
    <div class="l-sec">Drive 素材庫</div>
    <div id="driveWarningBanner" style="display:block;margin-bottom:8px;padding:10px 12px;background:rgba(212,24,46,0.15);border:1.5px solid #D4182E;border-radius:8px;text-align:center;">
      <div class="drive-warning-text" style="font-size:12px;font-weight:900;color:#FF4D6A;margin-bottom:4px;">· 尚未連結 Google Drive</div>
      <div style="font-size:10px;color:#FF8099;margin-bottom:8px;">必須先連結才能抓取素材庫</div>
      <button onclick="driveLogin()" style="padding:6px 16px;background:#D4182E;border:none;border-radius:6px;color:#fff;font-family:'Noto Sans TC';font-size:11px;font-weight:900;cursor:pointer;">· 立即連結 Drive</button>
    </div>
    <div class="dcfg-row">
      <input class="dcfg-input" id="inPhotoFolder" placeholder="圖 貼入照片資料夾連結或 ID">
      <button class="fetch-btn fetch-sky" id="fetchPhotoBtn" onclick="fetchDriveAssets('photo', renderAssets)">抓照片</button>
    </div>
    <div class="dcfg-row">
      <input class="dcfg-input" id="inVideoFolder" placeholder="影 貼入影片資料夾連結或 ID">
      <button class="fetch-btn fetch-sky" id="fetchVideoBtn" onclick="fetchDriveAssets('video', renderAssets)">抓影片</button>
    </div>
    <div class="dcfg-row" style="margin-bottom:4px;">
      <button class="fetch-btn fetch-sky" style="flex:1;font-size:11px;font-weight:900;" onclick="fetchBoth(renderAssets)">· 一鍵抓全部素材</button>
    </div>
    <div style="font-size:10px;color:var(--t3);">切換品牌自動填入資料夾</div>
  </div>
  <div class="asset-grid" id="assetGrid">
    <div class="empty"><div class="empty-p">貼上 Drive 資料夾連結<br>點「一鍵抓全部素材」</div></div>
  </div>
  <div class="deliver-zone">
    <div class="dz-head"><span class="dz-title">交付給投手</span><span class="dz-sub" id="dzSub">0 組素材</span></div>
    <div class="dz-body">
      <div class="dr" style="background:var(--bg4);font-size:8px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;">
        <span>#</span><span>腳本預覽</span><span>照片</span><span>影片</span><span>狀態</span>
      </div>
      <div id="deliverRows"><div style="text-align:center;padding:14px;font-size:10px;color:var(--t3);">尚無素材</div></div>
    </div>
    <div class="dz-footer">
      <button class="dz-copy" onclick="copyTSV(this)">複製全部 → 貼入 Google Sheet</button>
      <button class="dz-clear" onclick="clearAll()">清空</button>
    </div>
  </div>
</div>
</div>

<script src="shared.js"></script>
<script>
// ── 頁面狀態 ──
let scripts = [];
let delivers = [];

// ── 初始化 ──
window.addEventListener('load', async () => {
  if (!requireAuth()) return;
  renderNavRight();
  setDriveStatus('');
  await loadBrandData();
  renderNavBrands();
  renderBrandTree();
});

function onGSILoad() {
  initGoogleAuth(async () => {
    renderNavRight();
    setDriveStatus('ok');
    const warn = document.getElementById('driveWarningBanner');
    if (warn) warn.style.display = 'none';
  });
}

// ── 品牌樹 ──
function renderBrandTree() {
  document.getElementById('brandTree').innerHTML = BRANDS.map(b => {
    const isOpen = BS.openBrand === b.id;
    return `<div>
      <div class="brand-row ${BS.brandId === b.id && !BS.subId ? 'on' : ''}" onclick="clickBrand('${b.id}')">
        <span class="br-icon">${b.icon}</span>
        <div class="br-info"><div class="br-name">${b.name}</div><div class="br-sub">${b.subs.length}個系列</div></div>
        <span style="color:var(--t3);font-size:11px;${isOpen ? 'transform:rotate(90deg);display:inline-block' : ''}">›</span>
      </div>
      ${isOpen ? b.subs.map(sb =>
        `<div class="sub-brand-row ${BS.subId === sb.id ? 'on' : ''}" onclick="clickSub('${b.id}','${sb.id}')">
          <div class="dot"></div>${sb.name}
        </div>`
      ).join('') : ''}
    </div>`;
  }).join('');
}

function renderProds() {
  const el = document.getElementById('prodList');
  const brand = BRANDS.find(b => b.id === BS.brandId);
  if (!brand) { el.innerHTML = '<div class="empty" style="padding:24px 10px;"><div class="empty-p">← 先選品牌</div></div>'; return; }
  const subs = BS.subId ? brand.subs.filter(s => s.id === BS.subId) : brand.subs;
  let html = '';
  subs.forEach(sb => {
    const sc = getColor(sb.color);
    html += `<div style="margin-bottom:12px;">
      <div class="prod-grp-label" style="color:${sc.c}">${sb.name}</div>
      ${sb.prods.map(p =>
        `<div class="prod-row ${BS.prod?.id === p.id ? 'on' : ''}" onclick="clickProd('${sb.id}','${p.id}')">
          <div class="prod-dot"></div>
          <div><div class="prod-name">${p.name}</div><div class="prod-tag">${p.tag}</div></div>
        </div>`
      ).join('')}
    </div>`;
  });
  el.innerHTML = html;
}

function updateCtx() {
  const brand = BRANDS.find(b => b.id === BS.brandId);
  const sub = brand?.subs.find(s => s.id === BS.subId);
  const sc = getColor(sub?.color || brand?.navColor);
  const bEl = document.getElementById('gbBrand');
  const pEl = document.getElementById('gbProd');
  if (!brand) {
    bEl.textContent = '尚未選擇品牌'; bEl.style.color = 'var(--t3)';
    pEl.textContent = '← 先選商品'; pEl.style.color = 'var(--t3)';
    return;
  }
  bEl.style.color = sc.c;
  bEl.textContent = `${brand.icon} ${brand.name}${sub ? ' › ' + sub.name : ''}`;
  pEl.style.color = BS.prod ? 'var(--t1)' : 'var(--t3)';
  pEl.textContent = BS.prod ? BS.prod.name : '← 先選商品';
}

// ── 素材 ──
function renderAssets() {
  const grid = document.getElementById('assetGrid');
  let html = '';
  if (BS.photos.length) {
    html += `<div class="asset-sec"><div class="asset-sec-lbl">圖 照片素材 <span class="asset-count" style="color:var(--sky)">${BS.photos.length}</span></div>`;
    BS.photos.forEach((f, i) => { html += assetItemHtml(f, i, 'photo', BS.selPhoto === i); });
    html += '</div>';
  }
  if (BS.videos.length) {
    html += `<div class="asset-sec"><div class="asset-sec-lbl">影 影片素材 <span class="asset-count" style="color:var(--peach)">${BS.videos.length}</span></div>`;
    BS.videos.forEach((f, i) => { html += assetItemHtml(f, i, 'video', BS.selVideo === i); });
    html += '</div>';
  }
  if (!html) html = '<div class="empty"><div class="empty-p">貼上 Drive 資料夾連結<br>點「一鍵抓全部素材」</div></div>';
  grid.innerHTML = html;
}

function assetItemHtml(f, i, type, sel) {
  const fallback = type === 'photo' ? '圖' : '影';
  let thumb;
  if (f.src) thumb = `<img src="${escHtml(f.src)}" onerror="this.parentNode.textContent='${fallback}'">`;
  else if (f.thumb) thumb = `<img src="${escHtml(f.thumb)}" onerror="this.parentNode.textContent='${fallback}'">`;
  else thumb = fallback;
  const meta = f.driveUrl ? `<a href="${escHtml(f.driveUrl)}" target="_blank" style="color:var(--sky)">Drive ↗</a>` : 'Drive 素材';
  return `<div class="asset-item ${sel ? 'on' : ''} ${type}" onclick="selectAsset('${type}',${i})">
    <div class="ai-thumb">${thumb}</div>
    <div class="ai-info"><div class="ai-name">${escHtml(f.name)}</div><div class="ai-meta">${meta}</div></div>
    <span class="ai-check">✓</span>
  </div>`;
}

function selectAsset(type, i) {
  if (type === 'photo') BS.selPhoto = BS.selPhoto === i ? null : i;
  else BS.selVideo = BS.selVideo === i ? null : i;
  renderAssets();
  if (scripts.length > 0) {
    const brand = BRANDS.find(b => b.id === BS.brandId);
    const sub = brand?.subs.find(s => s.id === BS.subId);
    renderScripts(`${brand?.name || ''}${sub ? ' › ' + sub.name : ''}`, sub?.color || brand?.navColor);
  }
}

// ── 生成腳本 ──
async function doGenerate() {
  if (!BS.brandId) { alert('請先選擇品牌！'); return; }
  if (!BS.prod) { alert('請先選擇商品！'); return; }
  const brand = BRANDS.find(b => b.id === BS.brandId);
  const sub = brand?.subs.find(s => s.id === BS.subId);
  const soul = sub?.soul || brand?.soul || '';
  const style = sub?.adStyle || brand?.adStyle || '';
  const tags = sub?.hashtags || brand?.hashtags || '';
  const aud = document.getElementById('selAud').value;
  const count = parseInt(document.getElementById('selN').value) || 20;
  const copyLength = document.getElementById('selCopyLength').value || 'medium';
  const brandDisplay = `${brand.name}${sub && sub.id !== brand.id ? ' › ' + sub.name : ''}`;
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>生成中';
  const prog = document.getElementById('prog');
  const fill = document.getElementById('progFill');
  const progPctEl = document.getElementById('progPct');
  prog.style.display = 'block';
  let progVal = 0;
  const progInterval = setInterval(() => {
    if (progVal >= 92) return;
    progVal = Math.min(92, progVal + (progVal < 30 ? 2.5 : progVal < 60 ? 1.2 : 0.5));
    fill.style.width = progVal + '%';
    if (progPctEl) progPctEl.textContent = Math.round(progVal) + '%';
  }, 300);
  const copyLengthGuide = { short: '核心段落2-4行，精煉有力', medium: '核心段落5-8行，清楚說明', long: '核心段落10-15行，深度說服' }[copyLength];
  const prompt = `你是台灣頂尖FB廣告策略師，精通 Alex Hormozi 廣告矩陣。

【品牌】${brandDisplay}
【品牌靈魂】${soul}
【廣告風格】${style}
【商品】${BS.prod.name}（${BS.prod.tag}）
【目標受眾】${aud}
【Hashtag】${tags}
【文案規格】${copyLengthGuide}

━━━ ⚠️ 字數鐵則（違反不接受，生成前必須自我驗算）━━━
‣ hook.script：繁體中文字數【硬性上限 25 字】，只能 1 句話
‣ cta.script：繁體中文字數【硬性上限 20 字】，只能 1 句話
‣ 計算規則：每個中文字算 1 字，英文單字整體算 1 字，標點不計

━━━ HORMOZI 三段式框架 ━━━
生成「剛好 ${count} 組」，只回傳純 JSON：

{"combos":[{"id":"AD001","hook":{"method":"方向名稱","script":"鉤子≤25字","visual":"畫面建議"},"core":{"type":"廣告類型","script":"核心段落","solve":"解決什麼問題"},"cta":{"style":"CTA風格","script":"CTA≤20字"}}]}`;

  try {
    const res = await fetch(CF_WORKER_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'claude_generate', password: GAS_PASSWORD, prompt })
    });
    fill.style.width = '80%'; btn.innerHTML = '<span class="spin"></span>整理中...';
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || JSON.stringify(data));
    const raw = data.text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    scripts = parsed.combos || [];
    renderScripts(brandDisplay, sub?.color || brand?.navColor);
    const sb = document.getElementById('scriptBadge');
    if (sb) sb.textContent = scripts.length;
    const lenLabel = { short: '短文案', medium: '中文案', long: '長文案' }[copyLength];
    const tabBtn = document.querySelector('[data-tab="scripts"]');
    if (tabBtn) tabBtn.innerHTML = `廣告腳本 <span class="badge">${scripts.length}</span> <span style="font-size:8px;background:rgba(232,96,58,0.15);color:#E8603A;padding:1px 5px;border-radius:3px;">${lenLabel}</span>`;
    clearInterval(progInterval); fill.style.width = '100%';
    if (progPctEl) progPctEl.textContent = '✅';
    setTimeout(() => { prog.style.display = 'none'; if (progPctEl) progPctEl.textContent = ''; }, 800);
  } catch (e) {
    clearInterval(progInterval); prog.style.display = 'none';
    if (progPctEl) progPctEl.textContent = '';
    alert('生成失敗：' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = '⚡ 生成腳本';
  }
}

function renderScripts(brandDisplay, colorKey) {
  const sc = getColor(colorKey);
  document.getElementById('scriptsOut').innerHTML =
    `<div style="background:rgba(91,200,200,0.08);border:1px dashed rgba(91,200,200,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--sky);line-height:1.8;">
      · 右側選好 圖 照片 + 影 影片，點「＋加入交付」<br>
      · 選中：${BS.selPhoto !== null ? `<span style="color:var(--sky)">圖 ${escHtml(BS.photos[BS.selPhoto]?.name)}</span>` : '<span style="color:var(--t3)">未選</span>'}
      &nbsp;&nbsp;${BS.selVideo !== null ? `<span style="color:var(--peach)">影 ${escHtml(BS.videos[BS.selVideo]?.name)}</span>` : '<span style="color:var(--t3)">未選</span>'}
    </div>` +
    scripts.map((s, i) => {
      const hookLen = countWords(s.hook?.script || '');
      const ctaLen = countWords(s.cta?.script || '');
      return `<div class="ad-card" style="animation-delay:${i * 18}ms">
        <div class="ac-top">
          <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
            <span class="ac-id">${s.id}</span>
            <span class="ac-pill" style="background:${sc.bg};color:${sc.c};">${BS.prod?.name}</span>
            <span style="font-size:9px;color:var(--t3);">${s.core?.type || ''}</span>
          </div>
          <div style="display:flex;gap:5px;">
            <button class="tbtn tbtn-s" onclick="addDeliver(${i})">＋ 加入交付</button>
            <button class="tbtn tbtn-g" onclick="copyOne(${i},this)">複製腳本</button>
          </div>
        </div>
        <div class="ac-body">
          <div class="seg">
            <div class="seg-lbl" style="color:var(--sky)">· 黃金3秒鉤子</div>
            <div class="seg-txt" style="font-size:14px;font-weight:700;line-height:1.6;color:#F5F5F5;">${escHtml(s.hook?.script || '')}</div>
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:4px;">
              <span class="seg-badge" style="background:var(--sky2);color:var(--sky)">${escHtml(s.hook?.method || '')}</span>
              ${charBadge(hookLen, 25)}
            </div>
            <div class="seg-hint">· ${escHtml(s.hook?.visual || '')}</div>
          </div>
          <div class="seg">
            <div class="seg-lbl" style="color:var(--mint)">· 核心段落</div>
            <div class="seg-txt" style="white-space:pre-line">${escHtml(s.core?.script || '')}</div>
            <span class="seg-badge" style="background:var(--mint2);color:var(--mint)">${escHtml(s.core?.type || '')}</span>
            <div class="seg-hint">· ${escHtml(s.core?.solve || '')}</div>
          </div>
          <div class="seg">
            <div class="seg-lbl" style="color:var(--peach)">· 行動呼籲 CTA</div>
            <div class="seg-txt" style="font-size:14px;font-weight:700;line-height:1.6;color:#F5F5F5;">${escHtml(s.cta?.script || '')}</div>
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:4px;">
              <span class="seg-badge" style="background:var(--peach2);color:var(--peach)">${escHtml(s.cta?.style || '')}</span>
              ${charBadge(ctaLen, 20)}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
}

function copyOne(i, btn) {
  const s = scripts[i];
  const t = `【${s.id}】${BS.prod?.name}\n鉤子 ${s.hook?.method}：${s.hook?.script}\n畫面：${s.hook?.visual}\n\n核心 ${s.core?.type}：\n${s.core?.script}\n解決：${s.core?.solve}\n\nCTA ${s.cta?.style}：${s.cta?.script}`;
  navigator.clipboard.writeText(t).then(() => { btn.textContent = '✅ 已複製'; setTimeout(() => btn.textContent = '複製腳本', 2000); });
}

async function addDeliver(scriptIdx) {
  const s = scripts[scriptIdx];
  const photo = BS.selPhoto !== null ? BS.photos[BS.selPhoto] : null;
  const video = BS.selVideo !== null ? BS.videos[BS.selVideo] : null;
  const row = {
    id: s.id, brand: BS.brandId || '', product: BS.prod?.name || '',
    hookScript: s.hook?.script || '', coreScript: s.core?.script || '', ctaScript: s.cta?.script || '',
    photoName: photo?.name || '', photoUrl: photo?.driveUrl || '',
    videoName: video?.name || '', videoUrl: video?.driveUrl || '',
    status: !!(photo || video) ? '素材已備妥' : '缺素材',
    createdAt: new Date().toISOString()
  };
  try { await fetch(`${GAS_URL}?action=addDeliver&password=${GAS_PASSWORD}&row=${encodeURIComponent(JSON.stringify(row))}`); } catch (e) {}
  delivers.push({ ...row, ready: !!(photo || video) });
  renderDeliverRows(); renderDeliverOut();
  switchTab(document.querySelector('[data-tab="deliver"]'));
}

function renderDeliverRows() {
  const dzSub = document.getElementById('dzSub'); if (dzSub) dzSub.textContent = delivers.length + ' 組素材';
  const db = document.getElementById('deliverBadge'); if (db) db.textContent = delivers.length;
  const tbody = document.getElementById('deliverRows');
  if (!delivers.length) { tbody.innerHTML = '<div style="text-align:center;padding:14px;font-size:10px;color:var(--t3);">尚無素材</div>'; return; }
  tbody.innerHTML = delivers.map((r, i) => {
    const pLink = r.photoUrl ? `<a class="asset-link al-photo" href="${escHtml(r.photoUrl)}" target="_blank">圖</a>` : '<span class="asset-link al-none">圖</span>';
    const vLink = r.videoUrl ? `<a class="asset-link al-video" href="${escHtml(r.videoUrl)}" target="_blank">影</a>` : '<span class="asset-link al-none">影</span>';
    return `<div class="dr ${i === delivers.length - 1 ? 'new' : ''}">
      <span class="dr-id">${escHtml(r.id)}</span>
      <span class="dr-script" title="${escHtml(r.hookScript)}">${escHtml(r.hookScript.slice(0, 16))}…</span>
      <span>${pLink}</span><span>${vLink}</span>
      <span class="dr-status ${r.ready ? 'ds-ready' : 'ds-missing'}">${r.ready ? '✅' : '⚠️'}</span>
    </div>`;
  }).join('');
}

function renderDeliverOut() {
  const el = document.getElementById('deliverOut');
  if (!delivers.length) { el.innerHTML = '<div class="empty"><div class="empty-p">加入交付後顯示</div></div>'; return; }
  el.innerHTML = delivers.map((r, i) =>
    `<div style="background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">
        <span style="font-family:'DM Mono';font-size:11px;color:var(--gold)">${escHtml(r.id)}</span>
        <span style="font-size:10px;color:var(--t3)">${escHtml(r.product)}</span>
        <button class="tbtn tbtn-g" onclick="removeDeliver(${i})" style="font-size:9px">移除</button>
      </div>
      <div style="font-size:11px;line-height:1.8;margin-bottom:8px;">
        <span style="color:var(--sky)">鉤子</span> ${escHtml(r.hookScript)}<br>
        <span style="color:var(--peach)">CTA</span> ${escHtml(r.ctaScript)}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${r.photoUrl ? `<a href="${escHtml(r.photoUrl)}" target="_blank" class="asset-link al-photo">圖 ${escHtml(r.photoName || '照片')}</a>` : '<span class="asset-link al-none">無照片</span>'}
        ${r.videoUrl ? `<a href="${escHtml(r.videoUrl)}" target="_blank" class="asset-link al-video">影 ${escHtml(r.videoName || '影片')}</a>` : '<span class="asset-link al-none">無影片</span>'}
        <span class="dr-status ${r.ready ? 'ds-ready' : 'ds-missing'}">${r.ready ? '✅ 備妥' : '⚠️ 缺素材'}</span>
      </div>
    </div>`
  ).join('');
}

function removeDeliver(i) { delivers.splice(i, 1); renderDeliverRows(); renderDeliverOut(); }
function clearAll() { if (delivers.length && confirm(`清空所有${delivers.length}組？`)) { delivers = []; renderDeliverRows(); renderDeliverOut(); } }

function copyTSV(btn) {
  if (!delivers.length) { alert('尚無素材'); return; }
  const h = ['編號', '商品', '黃金3秒', '核心段落', 'CTA', '照片檔名', '照片連結', '影片檔名', '影片連結', '狀態'];
  const rows = delivers.map(r => [r.id, r.product, r.hookScript, r.coreScript, r.ctaScript, r.photoName, r.photoUrl, r.videoName, r.videoUrl, r.ready ? '備妥' : '缺素材'].join('\t'));
  navigator.clipboard.writeText([h.join('\t'), ...rows].join('\n')).then(() => { btn.textContent = '· 已複製！'; setTimeout(() => btn.textContent = '複製全部 → 貼入 Google Sheet', 3000); });
}

function switchTab(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('pane-' + btn.dataset.tab).classList.add('on');
}
</script>
<script src="https://accounts.google.com/gsi/client" onload="onGSILoad()" async defer></script>
</body>
</html>
